<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f3a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Forest Walk</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #8fb0d8; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
    background: #1f3a20; color: #e8f0e0; font-weight: 600; font-size: 18px;
  }
  #debug {
    position: fixed; left: 8px; top: 8px; padding: 4px 8px; border-radius: 6px;
    background: rgba(0, 0, 0, 0.45); color: #fff; font: 12px/1.3 ui-monospace, Menlo, monospace;
    pointer-events: none;
  }
  /* The stick: appears where the left thumb touches */
  #stick {
    position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none;
  }
  #stick::before, #knob {
    content: ""; position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
  }
  #stick::before {
    width: 132px; height: 132px; left: 0; top: 0;
    background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.45);
  }
  #knob { left: -30px; top: -30px; width: 60px; height: 60px; background: rgba(255, 255, 255, 0.55); transform: none; }
  #jump {
    position: fixed; right: calc(28px + env(safe-area-inset-right)); bottom: calc(28px + env(safe-area-inset-bottom));
    width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.18); color: #fff; font-size: 15px; font-weight: 700;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); touch-action: none;
  }
  #jump.pressed { background: rgba(255, 255, 255, 0.45); }
  #time {
    position: fixed; left: calc(12px + env(safe-area-inset-left)); top: 12px; padding: 6px 12px;
    border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(0, 0, 0, 0.3);
    color: #fff; font-size: 14px; font-weight: 600; touch-action: none;
  }
  #debug { top: 52px; }
  #fullscreen {
    position: fixed; right: calc(12px + env(safe-area-inset-right)); top: 12px; padding: 6px 10px;
    border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(0, 0, 0, 0.3);
    color: #fff; font-size: 13px;
  }
  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 8px 14px;
    border-radius: 10px; background: rgba(0, 0, 0, 0.45); color: #fff; font-size: 14px; line-height: 1.5;
    text-align: center; pointer-events: none; transition: opacity 1s; white-space: nowrap;
  }
  #hint.gone { opacity: 0; }
  /* Phones are played sideways */
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 20; place-items: center; text-align: center;
    background: #1f3a20; color: #e8f0e0; font-size: 18px; font-weight: 600; line-height: 1.7;
  }
  #rotate span { display: block; font-size: 56px; }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: grid; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="stick" hidden><div id="knob"></div></div>
<button id="jump" type="button">ジャンプ</button>
<button id="time" type="button">昼 10:00</button>
<button id="fullscreen" type="button" hidden>全画面</button>
<div id="hint">左の指で歩く ・ 右の指で見回す</div>
<div id="debug" hidden></div>
<div id="rotate"><div><span>📱↻</span>スマホを横向きにしてね</div></div>
<div id="loading">森を作っています…</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
