<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f3a20">
<title>Forest Walk</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb0d8; overscroll-behavior: none; }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #1f3a20; color: #e8f0e0; font: 600 18px/1.4 system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  #debug {
    position: fixed; left: 8px; top: 8px; padding: 4px 8px; border-radius: 6px;
    background: rgba(0, 0, 0, 0.45); color: #fff; font: 12px/1.3 ui-monospace, Menlo, monospace;
    pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">森を作っています…</div>
<div id="debug" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
